services:
  # ── PostgreSQL Database ────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ecohub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecohub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecohub_db}
    volumes:
      - ecohub_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecohub} -d ${POSTGRES_DB:-ecohub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecohub_network

  # ── Backend API (Node.js / Express) ───────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ecohub_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ecohub}:${POSTGRES_PASSWORD:-ecohub_dev_password}@db:5432/${POSTGRES_DB:-ecohub_db}"
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      FRONTEND_URL: "http://localhost:3000"
      NODE_ENV: production
      PINATA_JWT: ${PINATA_JWT}
      PINATA_GATEWAY_DOMAIN: ${PINATA_GATEWAY_DOMAIN}
      PINATA_GATEWAY_URL: ${PINATA_GATEWAY_URL}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_API_KEY_SECRET: ${PINATA_API_KEY_SECRET}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      RPC_URL_SEPOLIA: ${RPC_URL_SEPOLIA}
      RPC_URL_AMOY: ${RPC_URL_AMOY}
      PRIVATE_KEY: ${PRIVATE_KEY}
      USDC_ADDRESS: ${USDC_ADDRESS}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - ecohub_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-4000}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecohub_network

  # ── Frontend (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ecohub_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: "http://backend:${BACKEND_PORT:-4000}"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:${BACKEND_PORT:-4000}"
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-11155111}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS}
      NEXT_PUBLIC_PINATA_GATEWAY: ${NEXT_PUBLIC_PINATA_GATEWAY:-https://gateway.pinata.cloud/ipfs}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecohub_network

volumes:
  ecohub_pgdata:
    driver: local
  ecohub_uploads:
    driver: local

networks:
  ecohub_network:
    driver: bridge
